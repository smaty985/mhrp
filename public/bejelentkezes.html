<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bejelentkezés - MH RP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #07110b;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 420px;
            max-width: 92%;
            background: #101b13;
            border: 1px solid #344b38;
            border-radius: 16px;
            padding: 35px;
        }

        h1 {
            color: #d7b85b;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #07110b;
            color: white;
            border: 1px solid #344b38;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 0;
            border-radius: 8px;
            background: #c9aa4d;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            color: #d7b85b;
            margin-top: 20px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>BEJELENTKEZÉS</h1>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Felhasználónév"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Jelszó"
            required
        >

        <button type="submit">
            BEJELENTKEZÉS
        </button>

    </form>

    <div id="message"></div>

    <a href="/regisztracio.html">
        Nincs még fiókod? Regisztráció
    </a>

</div>

<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const data = await response.json();

        if (data.success) {

            message.style.color = "#72d572";
            message.textContent =
                "Sikeres bejelentkezés!";

            setTimeout(() => {
                window.location.href =
                    "/fiokom.html";
            }, 500);

        } else {

            message.style.color = "#ff7676";
            message.textContent =
                data.message;
        }
    });

</script>

</body>
</html>
