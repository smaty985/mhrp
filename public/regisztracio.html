<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció - MH RP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #07110b;
            color: #eee;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 420px;
            max-width: 92%;
            background: #101b13;
            border: 1px solid #344b38;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        h1 {
            text-align: center;
            color: #d7b85b;
            margin-top: 0;
        }

        p {
            text-align: center;
            color: #9da89f;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #07110b;
            color: white;
            border: 1px solid #344b38;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #d7b85b;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 0;
            border-radius: 8px;
            background: #c9aa4d;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e0c566;
        }

        a {
            display: block;
            text-align: center;
            color: #d7b85b;
            margin-top: 20px;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: #ff7676;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>REGISZTRÁCIÓ</h1>

    <p>Hozd létre az MH RP fiókodat.</p>

    <form id="registerForm">

        <input
            type="text"
            id="username"
            placeholder="Felhasználónév"
            required
        >

        <input
            type="text"
            id="robloxName"
            placeholder="Roblox-név"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Jelszó"
            required
        >

        <input
            type="password"
            id="passwordAgain"
            placeholder="Jelszó újra"
            required
        >

        <button type="submit">
            REGISZTRÁCIÓ
        </button>

    </form>

    <div id="message"></div>

    <a href="/bejelentkezes.html">
        Már van fiókod? Bejelentkezés
    </a>

</div>

<script>

document
    .getElementById("registerForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const robloxName =
            document.getElementById("robloxName").value.trim();

        const password =
            document.getElementById("password").value;

        const passwordAgain =
            document.getElementById("passwordAgain").value;

        const message =
            document.getElementById("message");

        const response = await fetch("/api/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                robloxName,
                password,
                passwordAgain
            })
        });

        const data = await response.json();

        if (data.success) {
            message.style.color = "#72d572";
            message.textContent =
                "Sikeres regisztráció! Átirányítás...";

            setTimeout(() => {
                window.location.href =
                    "/bejelentkezes.html";
            }, 1000);
        } else {
            message.style.color = "#ff7676";
            message.textContent = data.message;
        }
    });

</script>

</body>
</html>
